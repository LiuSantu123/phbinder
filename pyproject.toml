[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phbinder"
version = "0.1.0"
description = "Resumable pH-sensitive protein binder screening pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0"]

[project.scripts]
phbinder = "phbinder.cli:main"
phscreen = "phbinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
